name: Cyber Security Dashboard & Digest

on:
  schedule:
    # Rulează automat din 30 în 30 de minute
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite declanșarea manuală din interfața GitHub Actions

# Permisiuni minimale necesare pentru securitate și publicare pe GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Previne rulările paralele simultane dacă o execuție durează mai mult
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser

      - name: Run Digest Script & Generate HTML
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FORCE_EMAIL: "true"
        run: python digest.py

      - name: Upload Artifacts to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
